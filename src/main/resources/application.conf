# Add this section to your existing config
de.ddm {
  # TPCH-specific settings
  tpch {
    enabled = true
    sample-size = 10000  # Max rows to send to workers
    binary-inds-only = true  # Only check 2-column INDs
  }

  # Input configuration
  input {
    directory = "./data/TPCH"
    fileHasHeader = true
    separator = "|"
    skipLines = 0
    encoding = "UTF-8"

    # TPCH file patterns
    filePatterns = [
      "tpch_*.csv",
      "tpch_*.csv.gz"
    ]
  }

  # System configuration
  system {
    # Number of worker actors (matches your thread pool)
    numWorkers = 32  # Matches your fixed-pool-size

    # TPCH mode
    hardMode = false  # Binary INDs only for TPCH
    batchSize = 10000  # Rows per batch read from CSV

    # Discovery settings
    check-self-inds = false  # Don't check A ⊆ A
    check-reverse-inds = true  # Check both directions
  }

  # Output configuration
  output {
    file = "./results/tpch_discovered_inds.txt"
    format = "compact"  # compact|verbose|json
    include-statistics = true
  }

  # Performance tuning
  performance {
    max-rows-per-task = 10000
    ind-confidence-threshold = 1.0  # Require 100% inclusion
    enable-data-type-checking = true
  }
}

# Akka settings (your existing config plus)
akka {
  actor {
    # Keep your existing serialization settings...
    allow-java-serialization = on
    warn-about-java-serializer-usage = off
    # Memory settings for TPCH large data
    typed {
      mailbox-capacity = 1000
      stash-capacity = 1000
    }
  }

  # Cluster settings for distributed TPCH processing
  cluster {
    # TPCH doesn't need many nodes for testing
    min-nr-of-members = 1
    jmx.enabled = on

    # Roles for TPCH
    roles = [tpch-miner, tpch-worker]
    role {
      tpch-miner {
        min-nr-of-members = 1
      }
      tpch-worker {
        min-nr-of-members = 0
      }
    }
  }

  # Increase for TPCH large messages
  remote.artery.advanced {
    maximum-large-frame-size = 10 MiB  # Increased for TPCH data
    large-buffer-pool-size = 64
    outbound-large-message-queue-size = 512
  }

  # Your existing dispatchers - perfect for TPCH
  worker-pool-dispatcher {
    type = Dispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 32  # Good for TPCH parallel processing
    }
    throughput = 1
  }

  master-pinned-dispatcher {
    type = PinnedDispatcher
    executor = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 1
      allow-core-timeout = off
    }
    throughput = 1
  }

  # Logging for TPCH debugging
  loglevel = "INFO"  # Changed from DEBUG for cleaner TPCH output
  loggers = ["akka.event.slf4j.Slf4jLogger"]
}